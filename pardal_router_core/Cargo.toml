[package]
name = "pardal_router_core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "dsn_summary"
harness = false

[[bench]]
name = "dsn_to_ir_stamp"
harness = false

[[bench]]
name = "dial3d_route"
harness = false
