schema: pardal.routes
version: 0.1
board:
  board_ir_id: routing-dsl-example-board-v001
  frozen_board_snapshot_id: routing-dsl-example-board-v001-snapshot-sha256:497a6ac7eeb6abdc47319ceb5dc2de054bf4139cce1ae02a37c6e97ebfaa8c61
defaults:
  units:
    length: mm
  search:
    candidate_order: lexical
    max_candidates: 4
  diagnostics:
    emit_best_failed_candidate: true
route_groups:
  - id: rg_u1_to_j1
    name: route_u1_to_j1
    select:
      nets: [SIG_A]
      endpoints:
        - ref: U1
          pads: ["1"]
        - ref: J1
          pads: ["1"]
    scope:
      allowed_layers: [F.Cu, B.Cu]
      forbidden_layers: []
      corridors: []
      keepouts: []
    replacement:
      mode: scoped
      nets: [SIG_A]
      existing_route_groups: [rg_u1_to_j1]
      allow_power: false
      allow_planes: false
      max_removed_segments: 2
      max_removed_vias: 1
    variables:
      lane:
        values: [left, right]
