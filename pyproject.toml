[build-system]
requires = ["setuptools>=67.0", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pardal"
dynamic = ["version"]
description = "A command-line PCB place & route tool with autorouting and DRC."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0", "z3-solver==4.12.6.0"]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
]

[project.scripts]
pardal = "pardal.cli:main"
pardal-finalize = "pardal.finalize:main"

[tool.setuptools]
packages = {find = {include = ["pardal*"]}}

[tool.setuptools.dynamic]
version = {attr = "pardal.__version__"}

[tool.black]
target-version = ["py310"]
line-length = 88
extend-exclude = "(^venv/|^build/|^dist/|^\\.venv/|pardal/fastpath/_astar\\.c$)"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
addopts = "-m 'not slow'"
