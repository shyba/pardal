schema: pardal.routes
version: 0.1
board:
  board_ir_id: dspic-dev-board-ir-v001
  frozen_board_snapshot_id: dspic-dev-board-snapshot-v001

defaults:
  units:
    length: mm
  search:
    candidate_order: lexical
    max_candidates: 512
  diagnostics:
    emit_best_failed_candidate: true

route_groups:
  - id: rg_fpc_escape_a
    name: fpc_escape_a
    intent: route FPC bank A from MCU pads to connector lanes
    select:
      nets:
        - MCU_IO_01
        - MCU_IO_02
      endpoints:
        - ref: U1
          pads: [A1, B1]
        - ref: J1
          pads: ["1", "2"]
    scope:
      allowed_layers: [F.Cu, In1.Cu, In2.Cu, B.Cu]
      forbidden_layers: []
      corridors:
        - id: fpc_lane_west
          mode: hard
      keepouts:
        - id: antenna_keepout
          mode: hard
    replacement:
      mode: scoped
      nets: [MCU_IO_01, MCU_IO_02]
      existing_route_groups: [rg_fpc_escape_a]
      allow_power: false
      allow_planes: false
      max_removed_segments: 80
      max_removed_vias: 20
    placement_moves:
      - ref: J1
        envelope:
          dx: [-1.0mm, 1.0mm]
          dy: [0mm, 0mm]
        rotations: [0, 180]
        required: false
    variables:
      lane_order:
        values:
          - [MCU_IO_01, MCU_IO_02]
          - [MCU_IO_02, MCU_IO_01]
      fanout_side:
        values: [west, south]

  - id: rg_bus_escapes
    name: bus_escapes
    select:
      nets: [BUS_A, BUS_B]
      endpoints:
        - ref: U2
          pads: ["1", "2", "3"]
    scope:
      allowed_layers: [F.Cu, B.Cu]
      forbidden_layers: [In1.Cu]
      corridors: []
      keepouts:
        - id: keepout_critical
          mode: soft
    variables:
      bus_order:
        values:
          - [1, 2, 3]
          - [3, 2, 1]
